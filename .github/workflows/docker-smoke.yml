name: docker-smoke

on:
  pull_request:
  push:
    branches:
      - main
      - codex/infinimind-mvp

jobs:
  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start service and run Docker smoke checks
        shell: bash
        env:
          INFINIMIND_API_KEY: ci-dev-token
          INFINIMIND_ADMIN_API_KEY: ci-admin-token
          INFINIMIND_EMBEDDING_PROVIDER: mock
          INFINIMIND_EMBEDDING_MODEL: text-embedding-3-large
          OPENAI_API_KEY: ""
        run: |
          set -euo pipefail

          docker compose -f deploy/docker-compose.yml up -d --build

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/v1/health >/dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker logs infinimind-service || true
              echo "Service health check timed out."
              exit 1
            fi
            sleep 2
          done

          curl -fsS -H "Authorization: Bearer ${INFINIMIND_API_KEY}" http://127.0.0.1:8080/v1/ready >/dev/null
          curl -fsS http://127.0.0.1:8080/v1/metrics >/dev/null

          STORE_RESPONSE="$(curl -fsS \
            -H "Authorization: Bearer ${INFINIMIND_API_KEY}" \
            -H "Content-Type: application/json" \
            -X POST http://127.0.0.1:8080/v1/memory/store \
            -d '{"tenant_id":"default","user_id":"ci-user","agent_id":"main","text":"CI smoke memory record for store/recall/forget.","category":"fact"}')"

          MEMORY_ID="$(python3 - <<'PY' <<<"${STORE_RESPONSE}"
          import json
          import sys

          payload = json.load(sys.stdin)
          memory_id = payload.get("memory_id")
          if not memory_id:
              raise SystemExit("store response missing memory_id")
          print(memory_id)
          PY
          )"

          RECALL_RESPONSE="$(curl -fsS \
            -H "Authorization: Bearer ${INFINIMIND_API_KEY}" \
            -H "Content-Type: application/json" \
            -X POST http://127.0.0.1:8080/v1/memory/recall \
            -d '{"tenant_id":"default","user_id":"ci-user","agent_id":"main","query":"CI smoke memory record","limit":3,"rerank":"hybrid"}')"

          python3 - <<'PY' <<<"${RECALL_RESPONSE}"
          import json
          import sys

          payload = json.load(sys.stdin)
          if int(payload.get("count", 0)) < 1:
              raise SystemExit("recall response count < 1")
          PY

          FORGET_RESPONSE="$(curl -fsS \
            -H "Authorization: Bearer ${INFINIMIND_API_KEY}" \
            -H "Content-Type: application/json" \
            -X POST http://127.0.0.1:8080/v1/memory/forget \
            -d "{\"tenant_id\":\"default\",\"user_id\":\"ci-user\",\"agent_id\":\"main\",\"memory_id\":\"${MEMORY_ID}\"}")"

          python3 - <<'PY' <<<"${FORGET_RESPONSE}"
          import json
          import sys

          payload = json.load(sys.stdin)
          if payload.get("action") != "deleted":
              raise SystemExit(f"forget action was not deleted: {payload}")
          PY

      - name: Stop compose stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

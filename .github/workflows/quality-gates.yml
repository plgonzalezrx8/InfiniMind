name: quality-gates

on:
  pull_request:
  push:
    branches:
      - main
      - codex/infinimind-mvp

jobs:
  service-tests:
    name: service-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install service dependencies
        run: python -m pip install -e "services/infinimind-service[dev]"

      - name: Run service tests
        run: scripts/release_gates.sh --check service-tests

  bridge-quality:
    name: bridge-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: plugins/infinimind-openclaw-bridge/package-lock.json

      - name: Run bridge quality checks
        run: scripts/release_gates.sh --check bridge-quality

  openclaw-contract:
    name: openclaw-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run OpenClaw contract tests
        run: scripts/release_gates.sh --check openclaw-contract

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret scan
        run: scripts/release_gates.sh --check secret-scan

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start service and run Docker smoke checks
        env:
          INFINIMIND_API_KEY: ci-dev-token
          INFINIMIND_ADMIN_API_KEY: ci-admin-token
          INFINIMIND_EMBEDDING_PROVIDER: mock
          INFINIMIND_EMBEDDING_MODEL: text-embedding-3-large
          OPENAI_API_KEY: ""
        run: scripts/release_gates.sh --check docker-smoke

      - name: Stop compose stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  openclaw-e2e:
    name: openclaw-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: plugins/infinimind-openclaw-bridge/package-lock.json

      - name: Install bridge dependencies (includes OpenClaw CLI binary)
        working-directory: plugins/infinimind-openclaw-bridge
        run: npm ci --no-audit --no-fund

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run OpenClaw bridge CLI E2E harness
        env:
          OPENCLAW_BIN: ${{ github.workspace }}/plugins/infinimind-openclaw-bridge/node_modules/.bin/openclaw
          INFINIMIND_EMBEDDING_PROVIDER: mock
          INFINIMIND_EMBEDDING_MODEL: text-embedding-3-large
          INFINIMIND_API_KEY: infinimind-e2e-token
          INFINIMIND_ADMIN_API_KEY: infinimind-e2e-admin-token
        run: scripts/release_gates.sh --check openclaw-e2e

name: quality-gates

on:
  pull_request:
  push:
    branches:
      - main
      - codex/infinimind-mvp

jobs:
  service-tests:
    name: service-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install service dependencies
        run: python -m pip install -e "services/infinimind-service[dev]"

      - name: Run service tests
        run: scripts/release_gates.sh --check service-tests

  bridge-quality:
    name: bridge-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: plugins/infinimind-openclaw-bridge/package-lock.json

      - name: Run bridge quality checks
        run: scripts/release_gates.sh --check bridge-quality

  openclaw-contract:
    name: openclaw-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run OpenClaw contract tests
        run: scripts/release_gates.sh --check openclaw-contract

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret scan
        run: scripts/release_gates.sh --check secret-scan

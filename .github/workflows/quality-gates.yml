name: quality-gates

on:
  pull_request:
  push:
    branches:
      - main
      - codex/infinimind-mvp

jobs:
  service-tests:
    name: service-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install service dependencies
        run: python -m pip install -e "services/infinimind-service[dev]"

      - name: Run service tests
        run: python3 -m pytest services/infinimind-service/tests -q

  bridge-quality:
    name: bridge-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: plugins/infinimind-openclaw-bridge/package-lock.json

      - name: Install bridge dependencies
        working-directory: plugins/infinimind-openclaw-bridge
        run: npm ci --no-audit --no-fund

      - name: Run bridge typecheck
        working-directory: plugins/infinimind-openclaw-bridge
        run: npm run typecheck

      - name: Run bridge tests
        working-directory: plugins/infinimind-openclaw-bridge
        run: npm run test

  openclaw-contract:
    name: openclaw-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run OpenClaw contract tests
        run: python3 -m pytest tests/openclaw -q

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files for credential patterns
        shell: bash
        run: |
          set -euo pipefail

          found=0

          if git ls-files -z | xargs -0 grep -nE 'sk-[A-Za-z0-9_-]{20,}'; then
            found=1
          fi

          if git ls-files -z | xargs -0 grep -nE '(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-|AIza[0-9A-Za-z\-_]{35})'; then
            found=1
          fi

          if [ "$found" -ne 0 ]; then
            echo "Secret-like patterns detected in tracked files."
            exit 1
          fi

          echo "No secret-like patterns detected."

<svg width="960" height="280" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="InfiniMind logo">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="280" fill="url(#bg)" rx="20"/>

  <!-- Infinity-mind glyph -->
  <g transform="translate(48,40)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="200" rx="28" fill="#0f172a" stroke="#334155"/>

    <path d="M34 100
             C34 63 74 41 107 68
             C130 88 140 112 164 132
             C189 154 220 149 220 112
             C220 74 179 50 146 74
             C123 90 112 115 87 136
             C64 155 34 147 34 114"
          transform="translate(-27,-16) scale(0.95)"
          fill="none" stroke="url(#g1)" stroke-width="14" stroke-linecap="round"/>

    <circle cx="58" cy="101" r="8" fill="#38bdf8"/>
    <circle cx="140" cy="101" r="8" fill="#22c55e"/>

    <!-- Neural nodes -->
    <g stroke="#475569" stroke-width="2">
      <line x1="40" y1="54" x2="75" y2="72"/>
      <line x1="40" y1="146" x2="75" y2="128"/>
      <line x1="160" y1="54" x2="125" y2="72"/>
      <line x1="160" y1="146" x2="125" y2="128"/>
    </g>
    <g fill="#94a3b8">
      <circle cx="40" cy="54" r="4"/>
      <circle cx="40" cy="146" r="4"/>
      <circle cx="160" cy="54" r="4"/>
      <circle cx="160" cy="146" r="4"/>
    </g>
  </g>

  <g transform="translate(290,96)">
    <text x="0" y="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="700" fill="#e5e7eb">Infini<tspan fill="#38bdf8">Mind</tspan></text>
    <text x="2" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#94a3b8">Memory Sidecar for OpenClaw</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-label="InfiniMind MVP capability mix">
  <defs>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:700;fill:#0f172a}
      .lbl{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:16px;fill:#0f172a}
      .pct{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#334155}
    </style>
  </defs>
  <text x="40" y="42" class="title">InfiniMind MVP Capability Mix</text>

  <text x="40" y="100" class="lbl">Policy-filtered memory retrieval</text>
  <rect x="420" y="78" width="540" height="28" fill="#2563eb" rx="8"/>
  <text x="970" y="98" class="pct">30%</text>

  <text x="40" y="160" class="lbl">Bridge/OpenClaw compatibility</text>
  <rect x="420" y="138" width="450" height="28" fill="#0ea5e9" rx="8"/>
  <text x="880" y="158" class="pct">25%</text>

  <text x="40" y="220" class="lbl">Storage + migration safety</text>
  <rect x="420" y="198" width="360" height="28" fill="#22c55e" rx="8"/>
  <text x="790" y="218" class="pct">20%</text>

  <text x="40" y="280" class="lbl">Observability + CI gates</text>
  <rect x="420" y="258" width="270" height="28" fill="#f59e0b" rx="8"/>
  <text x="700" y="278" class="pct">15%</text>

  <text x="40" y="340" class="lbl">Admin/ops workflows</text>
  <rect x="420" y="318" width="180" height="28" fill="#a855f7" rx="8"/>
  <text x="610" y="338" class="pct">10%</text>
</svg>
